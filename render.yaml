# Render Blueprint specification for English Learning Platform
# Infrastructure: Render Web Service (Backend Docker) + Render Static Site (Frontend Vite) + Neon PostgreSQL
services:
  # ============================================================================
  # 1. Backend REST API - Laravel 12 on Docker
  # ============================================================================
  - type: web
    name: english-learning-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "English Learning Platform"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_PORT
        value: "5432"

      # Secrets & Dynamic Host URLs (to be set in Render dashboard or prompt)
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ============================================================================
  # 2. Frontend SPA - React 19 + TypeScript + Vite Static Site
  # ============================================================================
  - type: static
    name: english-learning-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite fallback: redirects all deep client routes to /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
